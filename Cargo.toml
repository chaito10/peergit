[workspace]

[package]
name = "peergit"
version = "0.1.0"
edition = "2021"
description = "P2P transport, discovery, identity and collaboration layer for Fossil repositories"

[[bin]]
name = "peergit"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

# Encoding
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P2P networking
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "kad",
    "relay",
    "ping",
    "macros",
    "request-response",
] }
futures = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Storage (application metadata only - Fossil owns repo DB)
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
directories = "5"

# Time
time = { version = "0.3", features = ["serde", "formatting"] }

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"

# Zeroize secret keys
zeroize = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
lto = true
strip = true
opt-level = "z"
codegen-units = 1
