site_name: PeerGit Documentation
site_description: Documentation for PeerGit, a P2P transport, discovery, identity and collaboration layer for Fossil repositories
site_url: https://chaito10.github.io/peergit

repo_url: https://github.com/chaito10/peergit
repo_name: chaito10/peergit

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Configuration: configuration.md
  - Concepts:
      - Identity: concepts/identity.md
      - Peers: concepts/peers.md
      - Repositories: concepts/repositories.md
      - Fossil Sync: concepts/fossil-sync.md
      - Patches: concepts/patches.md
  - Commands:
      - Overview: commands/index.md
      - peergit init: commands/init.md
      - peergit identity: commands/id.md
      - peergit peer: commands/peer.md
      - peergit node: commands/node.md
      - peergit repo: commands/repo.md
      - peergit sync: commands/sync.md
      - peergit config: commands/config.md
      - peergit transport: commands/transport.md
      - peergit fossil: commands/fossil.md
  - Architecture: architecture.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chaito10/peergit
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css
