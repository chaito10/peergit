name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            artifact: peergit-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            artifact: peergit-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            artifact: peergit-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            artifact: peergit-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            artifact: peergit-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/peergit.exe" -DestinationPath "${{ matrix.artifact }}"

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact }} peergit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 hashes
        run: |
          echo "## SHA256 Checksums" > checksums.txt
          echo '```' >> checksums.txt
          for f in artifacts/*; do
            sha256sum "$f" >> checksums.txt
          done
          echo '```' >> checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: checksums.txt
          files: artifacts/*
          draft: false
          prerelease: false

  scoop:
    name: Update Scoop Manifest
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: .

      - name: Compute SHA256
        id: hash
        run: |
          HASH=$(sha256sum peergit-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Clone scoop bucket
        uses: actions/checkout@v4
        with:
          repository: chaito10/scoop-bucket
          token: ${{ secrets.SCOOP_TOKEN }}
          path: scoop-bucket

      - name: Update manifest
        run: |
          cat > scoop-bucket/bucket/peergit.json << EOF
          {
              "version": "${{ github.ref_name }}",
              "description": "P2P transport, discovery, identity and collaboration layer for Fossil repositories",
              "homepage": "https://github.com/chaito10/peergit",
              "license": "SEE LICENSE IN LICENSE.md",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/chaito10/peergit/releases/download/${{ github.ref_name }}/peergit-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip",
                      "hash": "sha256:${{ steps.hash.outputs.hash }}"
                  }
              },
              "bin": "peergit.exe"
          }
          EOF

      - name: Commit and push
        run: |
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/peergit.json
          git diff --cached --quiet || git commit -m "chore: update peergit to ${{ github.ref_name }}"
          git push
